<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title>Naive RAG vs Knowledge-Map RAG</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1000" height="750" rx="16" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#212529">Naive RAG vs Knowledge-Map RAG</text>
  <text x="500" y="70" text-anchor="middle" font-size="14" fill="#6c757d">Same documents, same models. The difference is what gets stored at ingest and what the answer model gets to read.</text>

  <!-- column headers -->
  <rect x="30" y="90" width="460" height="52" rx="10" fill="#eef1f5" stroke="#adb5bd"/>
  <text x="260" y="113" text-anchor="middle" font-size="17" font-weight="700" fill="#343a40">Naive RAG</text>
  <text x="260" y="132" text-anchor="middle" font-size="12.5" fill="#6c757d">chunk → embed → top-k similar text</text>

  <rect x="510" y="90" width="460" height="52" rx="10" fill="#fff4ec" stroke="#e8590c"/>
  <text x="740" y="113" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">Knowledge-Map RAG</text>
  <text x="740" y="132" text-anchor="middle" font-size="12.5" fill="#6c757d">extract → link into a graph → reason over claims</text>

  <!-- INGEST -->
  <text x="40" y="168" font-size="11" font-weight="700" letter-spacing="1.5" fill="#868e96">INGEST · ONCE PER DOCUMENT</text>
  <text x="520" y="168" font-size="11" font-weight="700" letter-spacing="1.5" fill="#868e96">INGEST · ONCE PER DOCUMENT</text>

  <g font-size="13" text-anchor="middle">
    <!-- naive ingest -->
    <rect x="50" y="178" width="420" height="34" rx="7" fill="#f8f9fa" stroke="#ced4da"/>
    <text x="260" y="200" fill="#343a40">Split each document into 800-character chunks</text>
    <line x1="260" y1="212" x2="260" y2="226" stroke="#868e96" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="50" y="228" width="420" height="34" rx="7" fill="#f8f9fa" stroke="#ced4da"/>
    <text x="260" y="250" fill="#343a40">Embed every chunk</text>
    <line x1="260" y1="262" x2="260" y2="276" stroke="#868e96" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="50" y="278" width="420" height="38" rx="7" fill="#dee2e6" stroke="#adb5bd"/>
    <text x="260" y="302" font-weight="600" fill="#212529">Stored: a vector index of text chunks</text>

    <!-- map ingest -->
    <rect x="530" y="178" width="420" height="34" rx="7" fill="#fffaf5" stroke="#f3c6a5"/>
    <text x="740" y="200" fill="#343a40">LLM extracts entities, concepts and atomic claims</text>
    <line x1="740" y1="212" x2="740" y2="226" stroke="#868e96" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="530" y="228" width="420" height="34" rx="7" fill="#fffaf5" stroke="#f3c6a5"/>
    <text x="740" y="250" fill="#343a40">Link names to existing nodes · detect contradictions</text>
    <line x1="740" y1="262" x2="740" y2="276" stroke="#868e96" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="530" y="278" width="420" height="38" rx="7" fill="#ffe3cf" stroke="#e8590c"/>
    <text x="740" y="302" font-weight="600" fill="#7c2d12">Stored: nodes, claims with their source, contradictions</text>
  </g>

  <line x1="30" y1="336" x2="970" y2="336" stroke="#e9ecef" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- QUERY -->
  <text x="40" y="362" font-size="11" font-weight="700" letter-spacing="1.5" fill="#868e96">QUERY · EVERY QUESTION</text>
  <text x="520" y="362" font-size="11" font-weight="700" letter-spacing="1.5" fill="#868e96">QUERY · EVERY QUESTION</text>

  <g font-size="13" text-anchor="middle">
    <!-- naive query -->
    <rect x="50" y="372" width="420" height="34" rx="7" fill="#f8f9fa" stroke="#ced4da"/>
    <text x="260" y="394" fill="#343a40">Embed the question</text>
    <line x1="260" y1="406" x2="260" y2="420" stroke="#868e96" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="50" y="422" width="420" height="34" rx="7" fill="#f8f9fa" stroke="#ced4da"/>
    <text x="260" y="444" fill="#343a40">Take the 5 most similar chunks</text>
    <line x1="260" y1="456" x2="260" y2="470" stroke="#868e96" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="50" y="472" width="420" height="34" rx="7" fill="#f8f9fa" stroke="#ced4da"/>
    <text x="260" y="494" fill="#343a40">LLM answers from those 5 chunks</text>

    <!-- map query -->
    <rect x="530" y="372" width="420" height="34" rx="7" fill="#fffaf5" stroke="#f3c6a5"/>
    <text x="740" y="394" fill="#343a40">LLM reads the intent · find candidate nodes</text>
    <line x1="740" y1="406" x2="740" y2="420" stroke="#868e96" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="530" y="422" width="420" height="34" rx="7" fill="#fffaf5" stroke="#f3c6a5"/>
    <text x="740" y="444" fill="#343a40">LLM picks nodes → all their claims, each with its source</text>
    <line x1="740" y1="456" x2="740" y2="470" stroke="#868e96" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="530" y="472" width="420" height="34" rx="7" fill="#fffaf5" stroke="#f3c6a5"/>
    <text x="740" y="494" fill="#343a40">LLM answers, citing individual claims</text>
  </g>

  <text x="260" y="530" text-anchor="middle" font-size="12.5" fill="#495057">1 LLM call per question · ~2 s</text>
  <text x="740" y="530" text-anchor="middle" font-size="12.5" fill="#495057">3 LLM calls per question · ~13–17 s · plus extraction at ingest</text>

  <!-- example panel -->
  <rect x="30" y="548" width="940" height="184" rx="12" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="500" y="575" text-anchor="middle" font-size="14.5" font-weight="700" fill="#212529">Example: “Where does the manufacturer recommend its hidden HIDE doors?”</text>
  <text x="500" y="596" text-anchor="middle" font-size="12.5" fill="#6c757d">The answer is spread over 9 of the 15 articles (highlighted).</text>

  <!-- naive mini: top-5 box reaching a few articles -->
  <rect x="200" y="610" width="120" height="26" rx="13" fill="#dee2e6" stroke="#868e96"/>
  <text x="260" y="628" text-anchor="middle" font-size="12" font-weight="600" fill="#343a40">top-5 chunks</text>
  <g stroke="#868e96" stroke-width="1.5">
    <line x1="245" y1="636" x2="127" y2="664"/>
    <line x1="260" y1="636" x2="155" y2="664"/>
    <line x1="275" y1="636" x2="211" y2="664"/>
  </g>

  <!-- map mini: one node collecting from every relevant article -->
  <rect x="680" y="610" width="120" height="26" rx="13" fill="#ffe3cf" stroke="#e8590c"/>
  <text x="740" y="628" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">node: HIDE</text>
  <g stroke="#e8590c" stroke-width="1.5" opacity="0.85">
    <line x1="740" y1="636" x2="551" y2="664"/>
    <line x1="740" y1="636" x2="607" y2="664"/>
    <line x1="740" y1="636" x2="635" y2="664"/>
    <line x1="740" y1="636" x2="691" y2="664"/>
    <line x1="740" y1="636" x2="747" y2="664"/>
    <line x1="740" y1="636" x2="775" y2="664"/>
    <line x1="740" y1="636" x2="831" y2="664"/>
    <line x1="740" y1="636" x2="887" y2="664"/>
    <line x1="740" y1="636" x2="943" y2="664"/>
  </g>

  <!-- article rows (15 each; highlighted = mentions HIDE) -->
  <g stroke-width="1.2">
    <!-- naive row: x = 60 + i*28 -->
    <rect x="60"  y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="88"  y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="116" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="144" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="172" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="200" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="228" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="256" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="284" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="312" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="340" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="368" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="396" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="424" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="452" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <!-- map row: x = 540 + i*28 -->
    <rect x="540" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="568" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="596" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="624" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="652" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="680" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="708" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="736" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="764" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="792" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="820" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="848" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="876" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
    <rect x="904" y="664" width="22" height="28" rx="3" fill="#e9ecef" stroke="#ced4da"/>
    <rect x="932" y="664" width="22" height="28" rx="3" fill="#ffd8bf" stroke="#e8590c"/>
  </g>

  <text x="260" y="714" text-anchor="middle" font-size="12.5" fill="#495057">The 5 most similar chunks reach only a few of them</text>
  <text x="740" y="714" text-anchor="middle" font-size="12.5" fill="#495057">One node already holds the claims from all of them</text>
</svg>
